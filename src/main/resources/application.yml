spring:
  application:
    name: mini-calendly
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calendly?reWriteBatchedInserts=true}
    username: ${DB_USER:calendly}
    password: ${DB_PASSWORD:calendly}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 500
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

calendar:
  slots:
    min-duration: 5m
    max-duration: 8h
    max-batch-size: 500
    allow-past: false
  query:
    max-range: 93d
    max-users-for-common-availability: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
