services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: calendly
      POSTGRES_USER: calendly
      POSTGRES_PASSWORD: calendly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendly -d calendly"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/calendly?reWriteBatchedInserts=true
      DB_USER: calendly
      DB_PASSWORD: calendly
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - app
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  pgdata:
